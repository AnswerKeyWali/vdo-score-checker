<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajasthan VDO Exam Score Checker 2025</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f6f8fa; }
    h1 { color: #2b6cb0; }
    textarea { width: 100%; height: 120px; font-size: 16px; padding: 10px; }
    button { background: #2b6cb0; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
    #result { background: white; padding: 20px; margin-top: 20px; border-radius: 10px; }
  </style>
</head>
<body>

  <h1>📘 Rajasthan VDO Exam 2025 - Score Checker</h1>
  <p>Enter your OMR answers below (only A/B/C/D — 160 answers).</p>

  <textarea id="answers" placeholder="Example: ABCDBACD... (160 letters)"></textarea>
  <br><br>
  <button onclick="checkScore()">Check My Score</button>

  <div id="result"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>

</body>
</html>
